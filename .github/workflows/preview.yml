name: Preview

# ⚠️ Seperti deploy.yml — BELUM PERNAH DIJALANKAN. Butuh kredensial Cloudflare.

on:
  pull_request:

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dua penjaga:
    #  1. Fork tidak punya akses ke secrets — tanpa ini setiap PR dari fork
    #     gagal dengan error kredensial yang membingungkan.
    #  2. Selama kredensial Cloudflare belum dipasang, job ini DILEWATI, bukan
    #     dibiarkan merah. Check yang selalu gagal mengajari orang mengabaikan
    #     check — lalu check yang benar-benar penting ikut diabaikan.
    #
    # Aktifkan dengan menyetel repository variable:
    #   Settings > Secrets and variables > Actions > Variables
    #   ENABLE_CLOUDFLARE_DEPLOY = true
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.ENABLE_CLOUDFLARE_DEPLOY == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload

      - name: Komentari PR dengan URL preview
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            if (!url) return;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview: ${url}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
            });
