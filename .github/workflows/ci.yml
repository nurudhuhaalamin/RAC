name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Gagal-cepat: urutannya dari yang paling murah ke paling mahal, supaya
      # kesalahan sepele tidak menunggu build selesai untuk ketahuan.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # BLOCKING sejak T-102. Menegakkan D-05, D-12, dan A-09 — aturan yang
      # menyangkut risiko hukum, bukan gaya penulisan.
      - name: Validator konten (D-05)
        run: pnpm check:content

      - name: Unit test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browser Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Siapkan database lokal
        run: pnpm db:migrate:local && pnpm db:seed

      - name: E2E
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
